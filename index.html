<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>九九バトル！ - 思考最適化版</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ea;
            --text-color: #ffffff;
        }
        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen.active { display: flex; }

        /* Title Screen */
        h1 {
            font-size: 3rem;
            text-align: center;
            margin-top: 40px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            font-style: italic;
        }
        .btn {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 15px 30px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px auto;
            width: 80%;
            text-transform: uppercase;
            font-weight: bold;
        }
        .btn:active { background: var(--neon-pink); color: #000; }

        /* Game Screen */
        #hud { display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 20px; color: var(--neon-blue); }
        #question-box {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            font-weight: bold;
            text-shadow: 0 0 15px var(--text-color);
        }
        #answer-display {
            height: 80px;
            font-size: 4rem;
            text-align: center;
            color: var(--neon-pink);
            margin-bottom: 20px;
        }

        /* Number Keypad */
        #numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .nk {
            background: rgba(255,255,255,0.05);
            border: 1px solid #444;
            color: white;
            font-size: 2rem;
            padding: 20px 0;
            border-radius: 8px;
            cursor: pointer;
        }
        .nk:active { background: #555; }
        .nk.special { color: var(--neon-blue); }

        /* Ranking */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border-bottom: 1px solid #333; padding: 10px; text-align: left; }
        .rank-highlight { color: var(--neon-pink); font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Title -->
    <div id="s-title" class="screen active">
        <h1>九九バトル！</h1>
        <div style="flex-grow: 1;"></div>
        <button class="btn" onclick="initGame('classic')">START GAME</button>
        <button class="btn" onclick="showRanking()" style="border-color: var(--neon-blue); color: var(--neon-blue);">RANKING</button>
    </div>

    <!-- Play -->
    <div id="s-play" class="screen">
        <div id="hud">
            <div>SCORE: <span id="val-score">0</span></div>
            <div>TIME: <span id="val-time">30</span>s</div>
        </div>
        <div id="question-box"><span id="qtext">? × ?</span></div>
        <div id="answer-display"><span id="qans">＿</span></div>
        <div id="numpad">
            <button class="nk" onclick="nkPress('1')">1</button>
            <button class="nk" onclick="nkPress('2')">2</button>
            <button class="nk" onclick="nkPress('3')">3</button>
            <button class="nk" onclick="nkPress('4')">4</button>
            <button class="nk" onclick="nkPress('5')">5</button>
            <button class="nk" onclick="nkPress('6')">6</button>
            <button class="nk" onclick="nkPress('7')">7</button>
            <button class="nk" onclick="nkPress('8')">8</button>
            <button class="nk" onclick="nkPress('9')">9</button>
            <button class="nk special" onclick="nkPress('⌫')">⌫</button>
            <button class="nk" onclick="nkPress('0')">0</button>
            <button class="nk special" onclick="nkPress('OK')">OK</button>
        </div>
    </div>

    <!-- Result -->
    <div id="s-result" class="screen">
        <h1>FINISH!</h1>
        <div id="result-score" style="font-size: 3rem; text-align: center; margin: 40px 0;">0 pts</div>
        <button class="btn" onclick="location.reload()">TITLE</button>
    </div>

    <!-- Ranking -->
    <div id="s-rank" class="screen">
        <h2 style="color: var(--neon-blue);">TOP RANKERS</h2>
        <div id="rank-list" style="overflow-y: auto; flex-grow: 1;"></div>
        <button class="btn" onclick="goHome()">BACK</button>
    </div>
</div>

<script>
/* ---------------------------------------------------------
   State & Config
   --------------------------------------------------------- */
const S = {
    score: 0,
    time: 30,
    playing: false,
    timer: null,
    ca: 0, cb: 0, ans: '',
    nkLock: false,
    audioCtx: null,
    bgmStarted: false
};

const ac = () => S.audioCtx || (S.audioCtx = new (window.AudioContext || window.webkitAudioContext)());

/* ---------------------------------------------------------
   Audio Logic (Web Audio API)
   --------------------------------------------------------- */
function beep(freq, dur, vol=0.1) {
    const ctx = ac();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
}

function startBGM() {
    if (S.bgmStarted) return;
    const ctx = ac();
    if (ctx.state === 'suspended') ctx.resume();
    
    S.bgmStarted = true;
    let nextNote = ctx.currentTime;
    const bpm = 140;
    const step = 60 / bpm / 2;

    function loop() {
        while (nextNote < ctx.currentTime + 0.1) {
            // シンプルなテクノ系ベースラインの擬似再生
            if (S.playing) beep(55, 0.1, 0.05); 
            nextNote += step;
        }
        if (S.playing) requestAnimationFrame(loop);
    }
    loop();
}

/* ---------------------------------------------------------
   Game Logic
   --------------------------------------------------------- */
function initGame() {
    // モバイルブラウザの音声制限を解除するためのトリガー
    const ctx = ac();
    if (ctx.state === 'suspended') ctx.resume();
    
    changeScreen('s-play');
    S.score = 0;
    S.time = 30;
    S.playing = true;
    
    updateHUD();
    nextQuestion();
    startBGM();

    S.timer = setInterval(() => {
        S.time--;
        updateHUD();
        if (S.time <= 0) endGame();
    }, 1000);
}

function nextQuestion() {
    S.ca = Math.floor(Math.random() * 8) + 2;
    S.cb = Math.floor(Math.random() * 8) + 2;
    S.ans = '';
    document.getElementById('qtext').textContent = `${S.ca} × ${S.cb}`;
    document.getElementById('qans').textContent = '＿';
    document.getElementById('qans').style.color = 'var(--neon-pink)';
}

function nkPress(v) {
    if (S.nkLock || !S.playing) return;

    if (v === '⌫') {
        S.ans = S.ans.slice(0, -1);
    } else if (v === 'OK') {
        if (S.ans) checkAnswer();
        return;
    } else {
        if (S.ans.length >= 2) return;
        S.ans += v;
    }

    document.getElementById('qans').textContent = S.ans || '＿';

    // 入力最適化ロジック
    const correct = S.ca * S.cb;
    const userVal = parseInt(S.ans);

    if (userVal === correct) {
        S.nkLock = true;
        beep(880, 0.1, 0.1);
        setTimeout(() => { checkAnswer(); S.nkLock = false; }, 150);
    } else if (S.ans.length >= 2) {
        S.nkLock = true;
        document.getElementById('qans').style.color = '#ff4444';
        beep(220, 0.2, 0.1);
        setTimeout(() => { checkAnswer(); S.nkLock = false; }, 400);
    }
}

function checkAnswer() {
    const correct = S.ca * S.cb;
    if (parseInt(S.ans) === correct) {
        S.score += 10;
    } else {
        S.score = Math.max(0, S.score - 5);
    }
    updateHUD();
    nextQuestion();
}

function updateHUD() {
    document.getElementById('val-score').textContent = S.score;
    document.getElementById('val-time').textContent = S.time;
}

function endGame() {
    S.playing = false;
    clearInterval(S.timer);
    saveRank(S.score);
    changeScreen('s-result');
    document.getElementById('result-score').textContent = `${S.score} pts`;
}

/* ---------------------------------------------------------
   UI & Data
   --------------------------------------------------------- */
function changeScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function goHome() { changeScreen('s-title'); }

function saveRank(score) {
    try {
        let ranks = JSON.parse(localStorage.getItem('kuku_ranks') || '[]');
        ranks.push({ s: score, d: new Date().toLocaleDateString() });
        ranks.sort((a, b) => b.s - a.s);
        localStorage.setItem('kuku_ranks', JSON.stringify(ranks.slice(0, 10)));
    } catch(e) { console.error("Storage Error", e); }
}

function showRanking() {
    changeScreen('s-rank');
    const list = document.getElementById('rank-list');
    let ranks = [];
    try {
        ranks = JSON.parse(localStorage.getItem('kuku_ranks') || '[]');
    } catch(e) { ranks = []; }

    let html = '<table><tr><th>RANK</th><th>SCORE</th><th>DATE</th></tr>';
    ranks.forEach((r, i) => {
        html += `<tr><td>${i+1}</td><td class="rank-highlight">${r.s}</td><td>${r.d}</td></tr>`;
    });
    html += '</table>';
    list.innerHTML = ranks.length ? html : '<p style="text-align:center">No data yet</p>';
}

</script>
</body>
</html>

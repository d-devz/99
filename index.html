<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>九九バトル！</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#080817;--card:rgba(17,17,42,.78);--accent:#ff5a1f;--gold:#ffd700;--text:#fff;--dim:#b8b6d8}
html,body{height:100%}
body{
  background:
    radial-gradient(circle at 10% 14%, rgba(255,255,255,.55), transparent 16%),
    radial-gradient(circle at 16% 22%, rgba(255,180,220,.58), transparent 27%),
    radial-gradient(circle at 86% 18%, rgba(126,232,255,.55), transparent 29%),
    radial-gradient(circle at 20% 86%, rgba(194,166,255,.52), transparent 28%),
    radial-gradient(circle at 84% 82%, rgba(255,238,116,.56), transparent 29%),
    linear-gradient(135deg,#7bdcff 0%,#a98cff 30%,#ff9bd7 62%,#ffe36d 100%);
  background-size: 145% 145%;
  color:var(--text);
  font-family:'Hiragino Kaku Gothic ProN','メイリオ',sans-serif;
  display:flex;justify-content:center;min-height:100dvh;overflow:hidden;user-select:none;touch-action:none;
  animation:bgShift 13s ease-in-out infinite alternate;
}
@keyframes bgShift{0%{background-position:0% 20%}100%{background-position:100% 80%}}
#app{width:100%;max-width:430px;min-height:100dvh;position:relative;overflow:hidden;isolation:isolate}
.screen{display:none;width:100%;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;padding:16px;position:relative;z-index:2}
.screen.active{display:flex}
#stars,#fx-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:0}
#fx-canvas{z-index:3}
.bg-orb{position:fixed;border-radius:50%;filter:blur(12px);opacity:.68;pointer-events:none;z-index:1;animation:floatOrb 12s ease-in-out infinite alternate}
.bg-orb.o1{width:180px;height:180px;left:-30px;top:12%;background:radial-gradient(circle,#ff6ab0 0%, rgba(255,106,176,0) 68%)}
.bg-orb.o2{width:220px;height:220px;right:-50px;top:18%;background:radial-gradient(circle,#4bd1ff 0%, rgba(75,209,255,0) 70%);animation-duration:15s}
.bg-orb.o3{width:200px;height:200px;left:12%;bottom:-35px;background:radial-gradient(circle,#9d7bff 0%, rgba(157,123,255,0) 70%);animation-duration:14s}
.bg-orb.o4{width:150px;height:150px;right:8%;bottom:12%;background:radial-gradient(circle,#ffe05e 0%, rgba(255,224,94,0) 72%);animation-duration:13s}
@keyframes floatOrb{0%{transform:translateY(-8px) translateX(-8px) scale(1)}100%{transform:translateY(10px) translateX(12px) scale(1.12)}}

/* TITLE */
.logo{font-size:70px;font-weight:900;line-height:1;letter-spacing:-3px;background:linear-gradient(160deg,#fff36d 0%,#ff9f1a 25%,#ff4d5a 55%,#7f5cff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;animation:logoPulse 2.2s ease-in-out infinite}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 12px rgba(255,128,0,.8))}50%{filter:drop-shadow(0 0 30px rgba(127,92,255,.95))}}
.logo-sub{font-size:11px;letter-spacing:7px;color:#d3cff4;margin-top:6px;text-align:center;text-transform:uppercase}
.btn{border:none;border-radius:14px;color:#fff;font-weight:900;cursor:pointer;width:100%;max-width:300px;padding:15px;margin-top:10px;font-size:20px;letter-spacing:2px;transition:transform .1s,box-shadow .1s,filter .15s;touch-action:manipulation}
.btn:active{transform:scale(.95)}
.btn-main{background:linear-gradient(135deg,#ff8a00,#ff3d6e 55%,#7e53ff);box-shadow:0 6px 24px rgba(255,78,93,.45)}
.btn-sub{background:linear-gradient(135deg,rgba(30,30,53,.9),rgba(18,18,42,.9));font-size:15px;padding:13px;border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.btn:hover{filter:brightness(1.05)}

/* CHAR SELECT */
.sec-title{font-size:11px;font-weight:900;letter-spacing:5px;color:#ffd96b;text-transform:uppercase;margin-bottom:14px;text-shadow:0 0 12px rgba(255,217,107,.35)}
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;margin-bottom:14px}
.char-card{background:linear-gradient(180deg,rgba(22,27,65,.78),rgba(14,17,42,.82));backdrop-filter: blur(5px);border:2px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 4px 10px;text-align:center;cursor:pointer;transition:all .15s;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.char-card.selected{border-color:var(--gold);background:linear-gradient(180deg,rgba(62,44,6,.84),rgba(32,20,4,.88));box-shadow:0 0 26px rgba(255,215,0,.35);transform:scale(1.05)}
.cname{font-size:10px;font-weight:700;margin-top:5px;line-height:1.3}
.ctitle{font-size:9px;color:var(--dim);margin-top:2px}

/* COUNTDOWN */
#countdown-screen{background:radial-gradient(ellipse at center,rgba(255,133,0,.22) 0%,rgba(10,8,24,.15) 68%, transparent 100%)}
.cd-num{font-size:190px;font-weight:900;line-height:1;animation:cdIn .88s cubic-bezier(.25,.46,.45,.94)}
@keyframes cdIn{0%{transform:scale(2.5);opacity:0}35%{opacity:1}85%{transform:scale(1);opacity:1}100%{transform:scale(.65);opacity:0}}
.cd-go{font-size:82px;font-weight:900;background:linear-gradient(135deg,#fff36d,#ff7a00,#ff2e63);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:goIn .65s cubic-bezier(.34,1.56,.64,1)}
@keyframes goIn{0%{transform:scale(.2) rotate(-10deg);opacity:0}60%{transform:scale(1.25) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}

/* GAME */
.g-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;width:100%;padding:6px 0 4px}
.g-label{font-size:10px;letter-spacing:3px;color:#fff7c8;font-weight:900;text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,.22)}
.g-score{font-size:36px;font-weight:900;color:#fff36d;line-height:1;text-shadow:0 0 16px rgba(255,224,94,.62),0 2px 3px rgba(0,0,0,.25)}
.g-score.bump{animation:scoreBump .24s ease}
@keyframes scoreBump{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
.g-time{font-size:36px;font-weight:900;color:#fff;line-height:1;text-align:right;font-variant-numeric:tabular-nums;text-shadow:0 2px 3px rgba(0,0,0,.25)}
.g-time.warn{color:#ffeb3b;animation:timeBlink .22s ease-in-out infinite}
.mult-card{min-width:86px;padding:6px 9px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.10));border:1px solid rgba(255,255,255,.35);box-shadow:0 6px 16px rgba(0,0,0,.18);text-align:center}
.g-mult{font-size:28px;line-height:1;font-weight:900;color:#ffffff;text-shadow:0 0 14px rgba(255,74,168,.75)}
.g-mult.bump{animation:multBump .36s ease}
@keyframes multBump{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-4deg)}100%{transform:scale(1)}}
.fever-wrap{width:100%;height:14px;margin:4px 0 7px;border-radius:999px;background:rgba(255,255,255,.23);border:1px solid rgba(255,255,255,.35);overflow:hidden;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.16)}
.fever-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#fff36d,#ff7ad9,#7df9ff);transition:width .18s linear}
.fever-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
#app.fever-mode::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at 50% 35%,rgba(255,245,85,.28),transparent 34%),linear-gradient(135deg,rgba(255,0,180,.13),rgba(0,230,255,.15));animation:feverPulse .42s ease-in-out infinite alternate}
@keyframes feverPulse{from{opacity:.38}to{opacity:.82}}
@keyframes timeBlink{0%,100%{opacity:1}50%{opacity:.25}}
.tbar-wrap{width:100%;height:10px;background:rgba(21,21,48,.55);border-radius:999px;overflow:hidden;margin:4px 0 8px;border:1px solid rgba(255,255,255,.05)}
.tbar{height:100%;border-radius:999px;background:linear-gradient(90deg,#00ffd9,#6aff79,#fff06a,#ff7f50,#ff4d9d);transition:width .08s linear}
.char-zone{height:108px;display:flex;align-items:center;justify-content:center;position:relative;margin:2px 0}
#gc{transition:filter .1s}
.praise{position:absolute;font-size:21px;font-weight:900;color:#fff;text-shadow:0 0 16px rgba(255,255,255,.9),0 0 18px rgba(255,74,137,.6);animation:praiseFly .92s ease-out forwards;pointer-events:none;white-space:nowrap;z-index:10}
@keyframes praiseFly{0%{transform:translate(-50%,0) scale(.4);opacity:1}100%{transform:translate(-50%,-70px) scale(1.15);opacity:0}}
.combo-banner{position:absolute;left:50%;top:6px;transform:translateX(-50%) scale(.4);padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,rgba(255,243,109,.95),rgba(255,94,87,.95),rgba(126,83,255,.95));font-weight:900;font-size:18px;letter-spacing:1px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 10px 28px rgba(0,0,0,.22);opacity:0;z-index:12;pointer-events:none}
.combo-banner.show{animation:comboPop 1s ease forwards}
@keyframes comboPop{0%{opacity:0;transform:translateX(-50%) translateY(18px) scale(.35)}20%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.12)}75%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.95)}}
.special-cutin{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.2) rotate(-8deg);width:92%;padding:16px 10px;border-radius:24px;background:linear-gradient(135deg,#fff36d,#ff7a00,#ff4aa2,#7d5cff,#46e8ff);border:3px solid rgba(255,255,255,.92);box-shadow:0 16px 36px rgba(0,0,0,.28),0 0 34px rgba(255,255,255,.45);font-size:34px;font-weight:900;text-align:center;color:#fff;text-shadow:0 3px 4px rgba(0,0,0,.35);z-index:20;opacity:0;pointer-events:none}
.special-cutin.show{animation:specialCutin 1.05s cubic-bezier(.34,1.56,.64,1) forwards}
.special-cutin small{display:block;font-size:15px;margin-top:2px;letter-spacing:2px}
@keyframes specialCutin{0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-12deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.14) rotate(3deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-74%) scale(.92) rotate(0)}}
.q-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0;width:100%}
.q-num{font-size:60px;font-weight:900;line-height:1;letter-spacing:-2px}
.q-sep{font-size:42px;color:#b8b6d8;font-weight:300;margin:0 2px}
.q-ans{font-size:60px;font-weight:900;color:var(--gold);min-width:78px;text-align:center;border-bottom:3px solid var(--gold);padding:0 4px;line-height:1}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;margin-top:8px}
.nk{background:linear-gradient(180deg,rgba(19,19,48,.88),rgba(15,15,38,.95));border:2px solid rgba(255,255,255,.08);border-radius:12px;color:#fff;font-size:26px;font-weight:700;height:58px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .07s,transform .07s;touch-action:manipulation;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.nk:active{background:#2a2a55;transform:scale(.9)}
.nk-del{font-size:18px;background:linear-gradient(180deg,rgba(50,14,40,.92),rgba(30,8,22,.95));border-color:rgba(255,128,187,.28);color:#ff9ed2}
.nk-ok{font-size:15px;font-weight:900;background:linear-gradient(135deg,#0fa958,#08753d);border-color:#24d57f;color:#eafff4;letter-spacing:2px}
.wrong-flash{animation:wFlash .3s ease}
@keyframes wFlash{0%,100%{background:transparent}50%{background:rgba(255,0,0,.15)}}
@keyframes charJump{0%{transform:translateY(0) rotate(0deg)}45%{transform:translateY(-26px) scale(1.15) rotate(-5deg)}100%{transform:translateY(0) rotate(0deg)}}
@keyframes charShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.jump{animation:charJump .42s cubic-bezier(.34,1.56,.64,1)}
.shake{animation:charShake .3s ease}

/* RESULT */
.res-big{font-size:108px;font-weight:900;color:var(--gold);line-height:1;animation:popIn .65s cubic-bezier(.34,1.56,.64,1);text-shadow:0 0 18px rgba(255,215,0,.35)}
@keyframes popIn{0%{transform:scale(0)}75%{transform:scale(1.1)}100%{transform:scale(1)}}
.res-msg{font-size:16px;color:#fff0a6;margin:12px 0 4px;text-align:center;font-weight:700;line-height:1.5}

/* RANKING */
.rk-list{width:100%;margin:8px 0;max-height:58vh;overflow-y:auto;touch-action:pan-y}
.rk-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(180deg,rgba(17,17,42,.82),rgba(13,13,32,.86));backdrop-filter: blur(5px);border-radius:11px;margin-bottom:6px;border:1px solid rgba(255,255,255,.05)}
.rk-rank{font-size:17px;font-weight:900;width:26px;text-align:center;flex-shrink:0}
.rk-char-wrap{width:35px;height:45px;overflow:hidden;flex-shrink:0;position:relative}
.rk-char-inner{position:absolute;top:0;left:0;transform:scale(.5);transform-origin:top left}
.rk-info{flex:1;min-width:0}
.rk-score{font-size:22px;font-weight:900;color:var(--gold);flex-shrink:0}
.empty-msg{text-align:center;color:#d1cef4;padding:40px 0;font-size:15px;line-height:2.2}

.hidden-audio-note{margin-top:10px;font-size:11px;color:#d9d4ff;opacity:.75;text-align:center;line-height:1.6}

/* ─── KIDS FRIENDLY TUNE ─── */
.screen{padding:14px 16px}
.logo{
  background:linear-gradient(160deg,#ffffff 0%,#fff36d 16%,#ff8acc 48%,#6edfff 82%,#ffffff 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.logo-sub,.hidden-audio-note{color:#ffffff;text-shadow:0 1px 4px rgba(0,0,0,.18)}
.btn-main{background:linear-gradient(135deg,#ffcc4d,#ff83c7 48%,#66dfff);box-shadow:0 8px 22px rgba(255,131,199,.35),0 0 0 2px rgba(255,255,255,.28) inset}
.btn-sub{background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.42);box-shadow:0 6px 14px rgba(0,0,0,.13);color:#fff}
.sec-title{color:#ffffff;text-shadow:0 2px 6px rgba(88,82,180,.35);font-size:12px}
.char-card{
  background:rgba(255,255,255,.32);
  border:2px solid rgba(255,255,255,.56);
  box-shadow:0 9px 18px rgba(80,70,170,.14);
}
.char-card.selected{
  background:linear-gradient(180deg,rgba(255,255,255,.50),rgba(255,245,173,.54));
  border-color:#fff36d;
  box-shadow:0 0 24px rgba(255,255,255,.42),0 0 28px rgba(255,229,80,.42);
}
.g-label{color:#ffffff;text-shadow:0 1px 5px rgba(80,80,180,.28)}
.mult-card{background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.42)}
.fever-wrap{background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.38)}
.tbar-wrap{background:rgba(255,255,255,.26);border:2px solid rgba(255,255,255,.34)}
.q-row{
  background:rgba(255,255,255,.28);
  border:2px solid rgba(255,255,255,.38);
  border-radius:24px;
  padding:8px 4px;
  margin:4px 0 8px;
  box-shadow:0 8px 18px rgba(87,87,180,.13);
}
.q-num,.q-sep,.q-ans{text-shadow:0 2px 5px rgba(80,70,160,.22)}
.q-sep{color:#ffffff}
.nk{
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.28));
  border:2px solid rgba(255,255,255,.58);
  color:#ffffff;
  font-size:28px;
  border-radius:18px;
  box-shadow:0 7px 14px rgba(72,68,160,.14),0 0 0 1px rgba(255,255,255,.18) inset;
  text-shadow:0 2px 4px rgba(80,80,160,.28);
}
.nk:active{background:rgba(255,255,255,.72);transform:scale(.92)}
.nk-del{background:linear-gradient(180deg,rgba(255,188,220,.7),rgba(255,133,190,.48));color:#fff}
.nk-ok{background:linear-gradient(135deg,#78f0a3,#35cfff);border-color:rgba(255,255,255,.62);color:#fff}
.combo-lane{
  height:34px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:2px 0 3px;
  pointer-events:none;
}
.combo-banner{
  position:relative;
  left:auto;
  top:auto;
  transform:none;
  opacity:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:150px;
  max-width:96%;
  min-height:28px;
  padding:5px 12px;
  border-radius:999px;
  background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,241,111,.96),rgba(119,226,255,.94));
  color:#ff5da8;
  font-size:15px;
  white-space:nowrap;
  text-shadow:none;
  border:2px solid rgba(255,255,255,.8);
  box-shadow:0 6px 14px rgba(86,86,176,.16);
}
.combo-banner.show{animation:comboLanePop .95s ease forwards}
@keyframes comboLanePop{
  0%{opacity:0;transform:translateY(9px) scale(.72)}
  18%{opacity:1;transform:translateY(0) scale(1.07)}
  78%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-8px) scale(.96)}
}
.char-zone{height:104px;margin:0 0 2px}
.special-cutin{
  top:38%;
  width:88%;
  font-size:28px;
  border-radius:28px;
  background:linear-gradient(135deg,#fff,#fff36d,#ff9bd7,#83e6ff);
  color:#ff5da8;
  text-shadow:none;
}
.special-cutin small{color:#7b56ff}
.res-msg,.res-detail{color:#ffffff;text-shadow:0 2px 5px rgba(80,70,160,.24)}
.rk-item{background:rgba(255,255,255,.30);border:2px solid rgba(255,255,255,.35)}
.empty-msg{color:#ffffff}


#app.special-mode::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:
    radial-gradient(circle at center, rgba(255,255,255,.88) 0%, rgba(255,255,255,.42) 12%, rgba(255,255,255,0) 40%),
    linear-gradient(135deg, rgba(255,243,109,.18), rgba(255,120,200,.22), rgba(110,223,255,.22));
  animation:specialFlash .72s ease forwards;
}
#app.special-mode #gc{animation:specialHero .72s cubic-bezier(.34,1.56,.64,1)}
#app.special-mode .q-row{box-shadow:0 0 0 3px rgba(255,255,255,.45), 0 0 28px rgba(255,238,116,.55), 0 0 48px rgba(255,120,200,.28)}
@keyframes specialFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@keyframes specialHero{0%{transform:scale(1) rotate(0)}20%{transform:scale(1.28) rotate(-4deg)}55%{transform:scale(1.12) rotate(2deg)}100%{transform:scale(1) rotate(0)}}

</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="fx-canvas"></canvas>
<div class="bg-orb o1"></div>
<div class="bg-orb o2"></div>
<div class="bg-orb o3"></div>
<div class="bg-orb o4"></div>
<div id="app">

<div class="screen active" id="title-screen">
  <div id="title-char" style="margin-bottom:18px"></div>
  <div class="logo">九九<br>バトル！</div>
  <div class="logo-sub">KUKU BATTLE</div>
  <button class="btn btn-main" style="margin-top:28px" onclick="initAudio();playButtonTapFX();showCharSelect()">▶ はじめる</button>
  <button class="btn btn-sub" onclick="initAudio();playButtonTapFX();showRanking()">🏆 ランキング</button>
  <div class="hidden-audio-note">※ 音が出ます。キャラ選択からBGMが流れます。</div>
</div>

<div class="screen" id="char-select-screen">
  <div class="sec-title">キャラクターをえらべ！</div>
  <div class="char-grid" id="char-grid"></div>
  <button class="btn btn-main" id="start-btn" onclick="playButtonTapFX();startCountdown()" disabled style="opacity:.4;font-size:16px">キャラをえらんでください</button>
  <button class="btn btn-sub" onclick="playButtonTapFX();showTitle()" style="margin-top:6px">もどる</button>
</div>

<div class="screen" id="countdown-screen">
  <div id="cd-display"></div>
</div>

<div class="screen" id="game-screen">
  <div class="g-header">
    <div><div class="g-label">SCORE</div><div class="g-score" id="gscore">0</div></div>
    <div class="mult-card"><div class="g-label">倍率</div><div class="g-mult" id="gmult">×1</div></div>
    <div><div class="g-label" style="text-align:right">TIME</div><div class="g-time" id="gtime">30</div></div>
  </div>
  <div class="fever-wrap"><div class="fever-fill" id="fever-fill"></div><div class="fever-label" id="fever-label">FEVER GAUGE</div></div>
  <div class="tbar-wrap"><div class="tbar" id="tbar"></div></div>
  <div class="combo-lane"><div id="combo-banner" class="combo-banner"></div></div>
  <div class="char-zone">
    <div id="gc"></div>
    <div id="praise-zone" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none"></div>

function musicLoop(){
  if(S.musicMode==='none' || !S.audioReady) return;
  const c=ac();
  const cfg=MUSIC[S.musicMode];
  while(S.musicNext < c.currentTime + .35){
    const stepIndex=Math.round(S.musicNext / cfg.step) % cfg.len;
    const off=S.musicNext - c.currentTime;
    cfg.play(stepIndex,off);
    S.musicNext += cfg.step;
  }
  S.musicRaf=requestAnimationFrame(musicLoop);
}
function startMusic(mode){
  if(!S.audioReady) return;
  if(S.musicMode===mode) return;
  stopMusic();
  S.musicMode=mode;
  S.musicNext=ac().currentTime + .02;
  musicLoop();
}
function stopMusic(){
  S.musicMode='none';
  if(S.musicRaf) cancelAnimationFrame(S.musicRaf);

}

  const rs=()=>{c.width=window.innerWidth;c.height=window.innerHeight}; rs();
  const colors=['255,255,255','255,120,170','120,230,255','255,230,120','160,120,255'];
  const st=Array.from({length:120},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.8+.5,p:Math.random()*Math.PI*2,sp:Math.random()*.025+.005,col:colors[Math.floor(Math.random()*colors.length)]}));
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    st.forEach(s=>{s.p+=s.sp;const a=Math.sin(s.p)*.5+.5;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(${s.col},${a*.65+.08})`;ctx.fill();});
    requestAnimationFrame(draw);
  })();
  window.addEventListener('resize',rs);
}

function initFX(){
  const c=document.getElementById('fx-canvas');
  const ctx=c.getContext('2d');
  FX.ctx=ctx;
  const rs=()=>{c.width=window.innerWidth;c.height=window.innerHeight}; rs();
  window.addEventListener('resize',rs);
  if(FX.running) return;
  FX.running=true;
  (function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    FX.items = FX.items.filter(p=>p.life>0);
    FX.items.forEach(p=>{
      p.life -= 1;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
      ctx.fillStyle=p.color;
      if(p.type==='confetti') ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      else { ctx.beginPath(); ctx.arc(0,0,p.w/2,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    requestAnimationFrame(loop);
  })();
}
function spawnConfetti(centerX,centerY,count=34){
  const colors=['#ff4d9d','#ffd84c','#52e1ff','#7eff7e','#a775ff','#ff8a00'];
  for(let i=0;i<count;i++){
    FX.items.push({type:'confetti',x:centerX,y:centerY,vx:(Math.random()*2-1)*4.2,vy:-(Math.random()*5+2.5),g:.12+Math.random()*.06,rot:Math.random()*6.28,vr:(Math.random()*2-1)*.22,w:4+Math.random()*7,h:7+Math.random()*8,color:colors[Math.floor(Math.random()*colors.length)],life:40+Math.random()*22,maxLife:54});
  }
  for(let i=0;i<14;i++){
    FX.items.push({type:'spark',x:centerX,y:centerY,vx:(Math.random()*2-1)*2.2,vy:-(Math.random()*3+1),g:.08,rot:0,vr:0,w:3+Math.random()*4,h:3+Math.random()*4,color:colors[Math.floor(Math.random()*colors.length)],life:26+Math.random()*16,maxLife:38});
  }
}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function maybeStartMenuMusic(){ if(S.audioReady) startMusic('menu'); }

function showTitle(){
  clearInterval(S.timer); S.playing=false; const app=document.getElementById('app'); if(app) app.classList.remove('special-mode'); stopMusic(); maybeStartMenuMusic();
  const ch=CHARS[Math.floor(Math.random()*CHARS.length)];
  document.getElementById('title-char').innerHTML=`<div style="filter:drop-shadow(0 0 20px ${ch.color})">${ch.svg}</div>`;
  show('title-screen');
}
function showCharSelect(){
  clearInterval(S.timer); S.playing=false; const app=document.getElementById('app'); if(app) app.classList.remove('special-mode'); maybeStartMenuMusic();
  const g=document.getElementById('char-grid');
  g.innerHTML=CHARS.map((c,i)=>`<div class="char-card" id="cc${i}" onclick="selectChar(${i})"><div style="filter:drop-shadow(0 0 8px ${c.color})">${c.svg}</div><div class="cname">${c.name}</div><div class="ctitle" style="color:${c.color}">${c.title}</div></div>`).join('');
  S.char=null;
  const b=document.getElementById('start-btn');
  b.disabled=true; b.style.opacity='.4'; b.textContent='キャラをえらんでください';
  show('char-select-screen');
}
function selectChar(i){
  initAudio();
  S.char=i;
  document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('cc'+i).classList.add('selected');
  playSelectCharFX(i);
  const b=document.getElementById('start-btn');
  b.disabled=false; b.style.opacity='1'; b.textContent=`▶ ${CHARS[i].name}でバトル！`;
}

function startCountdown(){
  if(S.char===null) return;
  initAudio(); stopMusic(); S.playing=false; clearInterval(S.timer);
  show('countdown-screen');
  const d=document.getElementById('cd-display');
  const steps=[{t:'3',c:'#ff5a5a'},{t:'2',c:'#ffc542'},{t:'1',c:'#63ff9e'},{t:'GO!!',go:true}];
  let i=0;
  (function next(){
    if(i>=steps.length){ startGame(); return; }
    const s=steps[i];
    d.innerHTML=s.go?`<div class="cd-go">${s.t}</div>`:`<div class="cd-num" style="color:${s.c}">${s.t}</div>`;
    playCountdownFX(s.t);
    if(s.go) playStartHypeFX();
    i++;
    setTimeout(next,s.go?720:900);
  })();
}

function buildPad(){
  document.getElementById('numpad').innerHTML=['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(v=>{
    let cls='nk'; if(v==='⌫') cls+=' nk-del'; if(v==='OK') cls+=' nk-ok';
    return `<button class="${cls}" onclick="nkPress('${v}')">${v}</button>`;
  }).join('');
}
function genQ(){
  S.ca=Math.ceil(Math.random()*9); S.cb=Math.ceil(Math.random()*9); S.ans='';
  document.getElementById('qa').textContent=S.ca;
  document.getElementById('qb').textContent=S.cb;
  document.getElementById('qans').textContent='＿';
  document.getElementById('qans').style.color='var(--gold)';
}
function nkPress(v){
  if(S.nkLock||!S.playing) return;
  bell(520,0,.022);
  if(v==='⌫'){ S.ans=S.ans.slice(0,-1); }
  else if(v==='OK'){ if(S.ans) doSubmit(); return; }
  else { if(S.ans.length>=2) return; S.ans+=v; }
  document.getElementById('qans').textContent=S.ans||'＿';
  if(!S.ans) return;
  const correct=S.ca*S.cb, ua=parseInt(S.ans,10);
  if(ua===correct || S.ans.length===2){
    S.nkLock=true;
    setTimeout(()=>{doSubmit();S.nkLock=false;},90);
  }
}
function getMultiplier(){
  return Math.min(5, 1 + Math.floor((S.streak||0)/5));
}
function getFeverPercent(){
  return Math.max(0, Math.min(100, (S.feverLeft / S.feverMax) * 100));
}
function updateHud(prevMult,bumpScore=false){
  const scoreEl=document.getElementById('gscore');
  const multEl=document.getElementById('gmult');
  const feverFill=document.getElementById('fever-fill');
  const feverLabel=document.getElementById('fever-label');
  if(scoreEl) scoreEl.textContent=S.score;
  if(multEl){
    multEl.textContent=`×${S.mult}`;
    if(prevMult && prevMult!==S.mult){ multEl.classList.remove('bump'); void multEl.offsetWidth; multEl.classList.add('bump'); }
  }
  if(scoreEl && bumpScore){ scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
  if(feverFill) feverFill.style.width=getFeverPercent()+'%';
  if(feverLabel) feverLabel.textContent=S.feverLeft>0 ? `FEVER あと${S.feverLeft}秒 ×2` : 'FEVER GAUGE';
  const app=document.getElementById('app');
  if(app) app.classList.toggle('fever-mode', S.feverLeft>0);
}
function addFloatingPoints(points){
  const z=document.getElementById('praise-zone');
  const d=document.createElement('div');
  d.className='praise';
  d.textContent=`+${points}`;
  d.style.color=S.feverLeft>0 ? '#fff36d' : '#ffffff';
  d.style.left=(22+Math.random()*55)+'%';
  d.style.top=(44+Math.random()*18)+'%';
  d.style.fontSize='24px';
  z.appendChild(d);
  setTimeout(()=>d.remove(),950);
  playPointPopFX();
}
function showSpecial(text,sub=''){
  const el=document.getElementById('special-cutin');
  if(!el) return;
  el.innerHTML=`${text}${sub?`<small>${sub}</small>`:''}`;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}
function startFever(){
  S.feverLeft=S.feverMax;
  playFeverStartFX();
  showSpecial('フィーバー！','スコア2ばい！');
  const rect=document.getElementById('app').getBoundingClientRect();
  spawnConfetti(rect.left+rect.width/2, rect.top+rect.height*.28, 88);
  updateHud();
}
function showCombo(streak){
  if(streak<3) return;
  const el=document.getElementById('combo-banner');
  const word=COMBO_WORDS[Math.floor(Math.random()*COMBO_WORDS.length)];
  const feverText=S.feverLeft>0 ? ' FEVER×2!' : '';
  el.textContent=`${streak}れんぞく！ ×${S.mult}${feverText} ${word}`;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function addPraise(){
  const z=document.getElementById('praise-zone');
  const d=document.createElement('div');
  d.className='praise';
  d.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  d.style.left=(10+Math.random()*65)+'%';
  d.style.top=(10+Math.random()*30)+'%';
  z.appendChild(d); setTimeout(()=>d.remove(),950);
}
function animChar(type){
  const el=document.getElementById('gc'); el.classList.remove('jump','shake'); void el.offsetWidth; el.classList.add(type); setTimeout(()=>el.classList.remove(type),500);
}
function doSubmit(){
  if(!S.ans||!S.playing) return;
  const correct=S.ca*S.cb, ua=parseInt(S.ans,10);
  if(ua===correct){
    const prevMult=S.mult;
    S.correct++;
    S.streak=(S.streak||0)+1;
    S.maxCombo=Math.max(S.maxCombo||0,S.streak);
    S.mult=getMultiplier();
    const gained=100*S.mult*(S.feverLeft>0?2:1);
    S.score+=gained;
    document.getElementById('qans').style.color='#64ffbf';
    playCorrectFX(); playComboFX(S.streak); addPraise(); addFloatingPoints(gained); animChar('jump'); showCombo(S.streak);
    if(prevMult!==S.mult) playMultiplierUpFX();
    if(S.streak>=4){
      const rect=document.getElementById('app').getBoundingClientRect();
      spawnConfetti(rect.left+rect.width/2, rect.top+rect.height*.34, S.streak>=8?64:38);
    }
    if(S.streak>=7 && S.streak%7===0){
      playSpecialFX();
      activateSpecialMode();
      showSpecial('どかーん！','スペシャルアタック！');
      const rect=document.getElementById('app').getBoundingClientRect();
      spawnConfetti(rect.left+rect.width/2, rect.top+rect.height*.38, 120);
      spawnConfetti(rect.left+rect.width*.26, rect.top+rect.height*.36, 56);
      spawnConfetti(rect.left+rect.width*.74, rect.top+rect.height*.36, 56);
    }
    if(S.streak>=10 && S.streak%10===0){
      startFever();
    } else {
      updateHud(prevMult,true);
    }
  } else {
    S.streak=0; S.mult=1;
    playWrongFX(); animChar('shake'); updateHud();
    const gs=document.getElementById('game-screen'); gs.classList.add('wrong-flash'); setTimeout(()=>gs.classList.remove('wrong-flash'),320);
  }
  setTimeout(genQ,90);
}

function startGame(){
  S.score=0; S.correct=0; S.timeLeft=30; S.ans=''; S.streak=0; S.maxCombo=0; S.mult=1; S.feverLeft=0; S.playing=true; S.nkLock=false;
  const ch=CHARS[S.char];
  document.getElementById('gscore').textContent='0';
  document.getElementById('gmult').textContent='×1';
  document.getElementById('gtime').textContent='30';
  document.getElementById('gtime').classList.remove('warn');
  document.getElementById('tbar').style.width='100%';
  document.getElementById('fever-fill').style.width='0%';
  document.getElementById('fever-label').textContent='FEVER GAUGE';
  document.getElementById('app').classList.remove('fever-mode');
  document.getElementById('app').classList.remove('special-mode');
  document.getElementById('gc').innerHTML=`<div style="filter:drop-shadow(0 0 16px ${ch.color})">${ch.svg}</div>`;
  document.getElementById('praise-zone').innerHTML='';
  document.getElementById('combo-banner').classList.remove('show');
  document.getElementById('special-cutin').classList.remove('show');
  buildPad(); genQ(); show('game-screen'); startMusic('game'+S.char);
  clearInterval(S.timer);
  S.timer=setInterval(()=>{
    S.timeLeft--;
    if(S.feverLeft>0) S.feverLeft--;
    document.getElementById('gtime').textContent=S.timeLeft;
    document.getElementById('tbar').style.width=(S.timeLeft/30*100)+'%';
    if(S.timeLeft<=5){ document.getElementById('gtime').classList.add('warn'); playTimeWarn(); }
    updateHud();
    if(S.timeLeft<=0){ clearInterval(S.timer); S.playing=false; endGame(); }
  },1000);
}
function endGame(){
  stopMusic(); playResultFX(); startMusic('result'); saveRank(S.char,S.score);
  document.getElementById('app').classList.remove('fever-mode');
  document.getElementById('app').classList.remove('special-mode');
  const ch=CHARS[S.char];
  document.getElementById('res-char').innerHTML=`<div style="filter:drop-shadow(0 0 22px ${ch.color})">${ch.svg}</div>`;
  const msgs=['😤 次はもっとできる！','💪 いいね！練習あるのみ！','🌟 よくできました！','⚡ すごい！九九マスター！','🔥 まさに伝説！最強バトラー！'];
  document.getElementById('res-msg').textContent=msgs[Math.min(Math.floor(S.correct/5),4)];
  document.getElementById('res-correct').textContent=`正解 ${S.correct}問 / 最高コンボ ${S.maxCombo} COMBO`;
  const rect=document.getElementById('app').getBoundingClientRect();
  spawnConfetti(rect.left+rect.width/2, rect.top+rect.height*.22, 94);
  let n=0,t=S.score; document.getElementById('res-score').textContent='0';
  const step=Math.max(50,Math.ceil(t/28));
  const iv=setInterval(()=>{n=Math.min(n+step,t);document.getElementById('res-score').textContent=n;if(n>=t)clearInterval(iv);},35);
  show('result-screen');
}

function saveRank(charId,score){
  try{let r=JSON.parse(localStorage.getItem('kukuRank')||'[]');r.push({charId,score,date:new Date().toLocaleDateString('ja-JP')});r.sort((a,b)=>b.score-a.score);localStorage.setItem('kukuRank',JSON.stringify(r.slice(0,10)));}catch(e){}
}
function showRanking(){
  maybeStartMenuMusic();
  let r=[]; try{ r=JSON.parse(localStorage.getItem('kukuRank')||'[]'); }catch(e){}
  const medals=['🥇','🥈','🥉'];
  document.getElementById('rk-list').innerHTML=r.length===0
    ?'<div class="empty-msg">まだ記録がありません。<br>さっそくバトルしよう！</div>'
    :r.map((item,i)=>{ const ch=CHARS[item.charId]; return `<div class="rk-item"><div class="rk-rank">${i<3?medals[i]:(i+1)+'位'}</div><div class="rk-char-wrap"><div class="rk-char-inner" style="filter:drop-shadow(0 0 6px ${ch.color})">${ch.svg}</div></div><div class="rk-info"><div class="rk-cname" style="color:${ch.color}">${ch.name}</div><div class="rk-date">${item.date}</div></div><div class="rk-score">${item.score}<span class="rk-unit">pt</span></div></div>`;}).join('');
  show('ranking-screen');
}

window.addEventListener('load',()=>{ initStars(); initFX(); showTitle(); });
</script>
